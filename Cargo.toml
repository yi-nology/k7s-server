[package]
name = "k7s-server"
version.workspace = true
description = "k7s server — axum HTTP + MCP server for k7s"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "k7s_server"
crate-type = ["rlib"]

[dependencies]
k7s-deps.workspace = true
k7s-core.workspace = true
# The shared command registry (web dispatch) — pulls the tauri command surface.
k7s-commands = { path = "../k7s-commands", optional = true }

serde.workspace = true
thiserror.workspace = true
tokio.workspace = true

# --- Web server ---
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
open = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }

# --- MCP server ---
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# --- Password gate (web shell auth) ---
argon2.workspace = true
rustls.workspace = true

# --- Startup banner ---
local-ip-address.workspace = true
hostname.workspace = true

[features]
web = ["dep:axum", "dep:tower", "dep:tower-http", "dep:k7s-commands", "tower-http/fs", "dep:rmcp", "dep:schemars", "rmcp/transport-streamable-http-server", "dep:rust-embed", "dep:open", "dep:mime_guess"]
mcp = ["dep:rmcp", "dep:schemars"]

[[bin]]
name = "k7s-web"
path = "src/bin/k7s-web.rs"
required-features = ["web"]

[[bin]]
name = "k7s-mcp"
path = "src/bin/k7s-mcp.rs"
required-features = ["mcp"]

[dev-dependencies]
tower = { workspace = true }
http-body-util = { workspace = true }
