[package]
name = "k7s-server"
version = "0.5.0"
description = "k7s server — axum HTTP + MCP server for k7s"
authors = ["k7s"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "k7s_server"
crate-type = ["rlib"]

[dependencies]
k7s-deps = { git = "https://github.com/yi-nology/k7s-deps.git" }
k7s-core = { git = "https://github.com/yi-nology/k7s-core.git" }
# The shared command registry (web dispatch) — pulls the tauri command surface.
k7s-commands = { git = "https://github.com/yi-nology/k7s-commands.git", optional = true, default-features = false }

serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time"] }

# --- Web server ---
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace", "fs"] }
rust-embed = { version = "8", optional = true }
open = { version = "5", optional = true }
mime_guess = { version = "2", optional = true }

# --- MCP server ---
rmcp = { version = "3", optional = true, features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = { version = "1.0", features = ["chrono04"], optional = true }

# --- Password gate (web shell auth) ---
# "std" pulls in rand_core's OsRng (via password-hash/std), which the salt
# generation in `auth_password.rs` needs.
argon2 = { version = "0.5", features = ["std"] }
rustls = { version = "0.23", features = ["ring"] }

# --- Startup banner ---
local-ip-address = "0.6"
hostname = "0.4"

[features]
web = ["dep:axum", "dep:tower", "dep:tower-http", "tower-http/fs", "dep:rmcp", "dep:schemars", "rmcp/transport-streamable-http-server", "dep:rust-embed", "dep:open", "dep:mime_guess", "dep:k7s-commands"]
mcp = ["dep:rmcp", "dep:schemars"]

[[bin]]
name = "k7s-web"
path = "src/bin/k7s-web.rs"
required-features = ["web"]

[[bin]]
name = "k7s-mcp"
path = "src/bin/k7s-mcp.rs"
required-features = ["mcp"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
