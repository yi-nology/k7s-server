name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: cargo check/clippy/test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # k7s-web embeds the frontend; any static files satisfy rust-embed in CI.
      - run: mkdir -p dist && echo ok > dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo check --features web,mcp
      - run: cargo test --features web --test web_api
